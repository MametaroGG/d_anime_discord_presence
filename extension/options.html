<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>dアニメ Discord Presence+ 設定</title>
  <style>
    body {
      font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      margin: 16px;
      min-width: 320px;
      line-height: 1.5;
    }
    label { display: flex; gap: 8px; align-items: flex-start; }
    .hint { color: #666; font-size: 12px; margin: 8px 0 0 24px; }
    #status { margin-top: 12px; font-size: 12px; color: #0a7; }
  </style>
</head>
<body>
  <h1 style="font-size:16px;margin:0 0 12px;">設定</h1>
  <label>
    <input type="checkbox" id="showThumbnail" />
    <span>プロフィールに作品サムネイルを表示する</span>
  </label>
  <p class="hint">
    オンにすると、作品画像 URL を Discord 表示用に利用します（画像プロキシ経由）。
    著作権・利用規約上の判断はご自身で行ってください。
  </p>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
